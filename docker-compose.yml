name: ai-reality

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-reality-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_reality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_reality_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ai_reality}
    ports:
      # 5432 et 5433 sont déjà utilisés par d'autres projets sur cette machine.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_reality} -d ${POSTGRES_DB:-ai_reality}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
